name: Build Flutter APK

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: ดึงโค้ดจาก Repository
      uses: actions/checkout@v4

    - name: ติดตั้ง Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: ติดตั้ง Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: โหลดแพ็กเกจต่างๆ ของแอป
      run: flutter pub get

    - name: แก้ไขบั๊กแพ็กเกจ tflite_v2 อัตโนมัติ
      run: |
        FILE=$(ls /home/runner/.pub-cache/hosted/pub.dev/tflite_v2-*/android/build.gradle 2>/dev/null | head -n 1)
        if [ -n "$FILE" ]; then
          echo "android { namespace 'sq.flutter.tflite' }" >> "$FILE"
        fi

    - name: สร้างไฟล์ APK
      run: flutter build apk --release

    - name: นำไฟล์ APK ออกมาให้ดาวน์โหลด
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
