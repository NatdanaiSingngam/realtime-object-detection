name: Build Flutter APK

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: ดึงโค้ดจาก Repository
      uses: actions/checkout@v4

    - name: ติดตั้ง Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: ติดตั้ง Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: โหลดแพ็กเกจต่างๆ ของแอป
      run: flutter pub get

    - name: แก้ไขบั๊กโค้ดเก่าของ Android
      run: |
        # 1. แก้บั๊ก tflite_v2 namespace
        FILE=$(ls /home/runner/.pub-cache/hosted/pub.dev/tflite_v2-*/android/build.gradle 2>/dev/null | head -n 1)
        if [ -n "$FILE" ]; then
          echo "android { namespace 'sq.flutter.tflite' }" >> "$FILE"
        fi
        
        # 2. อัปเดต Android SDK เป็น 36 เพื่อให้รองรับแพ็กเกจ Camera
        sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle
        sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' android/app/build.gradle

    - name: สร้างไฟล์ APK (โหมด Debug เพื่อข้ามบั๊ก R8)
      run: flutter build apk --debug

    - name: นำไฟล์ APK ออกมาให้ดาวน์โหลด
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
